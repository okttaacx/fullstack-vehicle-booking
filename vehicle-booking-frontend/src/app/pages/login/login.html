<div class="login-page">
  <div class="hero-panel">
    <div class="hero-blob blob-1"></div>
    <div class="hero-blob blob-2"></div>
    <div class="hero-blob blob-3"></div>

    <div class="hero-content">
      <span class="brand-name">VB System</span>

      <h1 class="hero-title">Kelola pemesanan<br>kendaraan perusahaan<br>dalam satu tempat</h1>
      <p class="hero-subtitle">Monitoring BBM, jadwal service, dan persetujuan pemesanan kendaraan secara terpusat.</p>
    </div>
  </div>

  <div class="form-panel">
    <div class="login-card">
      <h2 class="login-title">Masuk ke akun Anda</h2>
      <p class="login-subtitle">Silakan masukkan username dan password</p>

      <div class="field">
        <label>Username</label>
        <input
          type="text"
          [(ngModel)]="username"
          name="username"
          placeholder="Masukkan username"
        >
      </div>

      <div class="field">
        <label>Password</label>
        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          placeholder="Masukkan password"
          (keyup.enter)="doLogin()"
        >
      </div>

      @if (loginError) {
        <p class="error-text">{{ loginError }}</p>
      }

      <button class="login-btn" (click)="doLogin()" [disabled]="loading">
        {{ loading ? 'Memproses...' : 'Masuk' }}
      </button>
    </div>
  </div>
</div>
